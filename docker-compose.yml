# docker-compose.yml
# Spins up local dev dependencies: Qdrant vector DB.
# Use this to develop without needing a live OpenStack / Prometheus / OpenSearch.
#
# Usage:
#   docker compose up -d
#   docker compose down

version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: openstack-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Optional: local Prometheus for testing monitoring tools
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: openstack-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  qdrant_data:
